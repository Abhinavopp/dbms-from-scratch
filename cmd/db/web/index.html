<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB From Scratch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand">DB FROM SCRATCH</div>
        </div>
        <div class="connection-badge">
          <span class="signal"></span>
          Database Connected
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar panel">
          <div class="section-label">DATABASE</div>
          <div id="schemaTree" class="schema-tree"></div>
        </aside>

        <main class="main-panel panel">
          <div class="editor-header">
            <div class="section-label">SQL EDITOR</div>
            <div class="editor-actions">
              <button id="run" class="primary">▶ RUN QUERY</button>
              <button id="format" class="secondary">FORMAT</button>
              <button id="clear" class="secondary">CLEAR</button>
            </div>
          </div>

          <textarea id="sql" spellcheck="false" aria-label="SQL editor">SELECT * FROM users LIMIT 10;</textarea>

          <div class="status-row">
            <span id="status" class="status neutral">Ready</span>
          </div>

          <div class="results-header">
            <div class="section-label">RESULTS</div>
          </div>

          <div class="table-wrap">
            <table>
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
            <div id="emptyState" class="empty-state hidden">No rows returned for this query.</div>
          </div>
        </main>

      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
